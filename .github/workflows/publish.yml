name: publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release identity and npm support
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag $RELEASE_TAG must be annotated." >&2
            exit 1
          fi
          npm_version="$(npm --version)"
          node --input-type=module --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const supported = major > 11 ||
              (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!supported) {
              console.error(`npm ${process.argv[1]} does not support trusted publishing.`);
              process.exit(1);
            }
          ' "$npm_version"

      - name: Install locked dependencies
        run: npm ci

      - name: Run release verification
        run: npm run verify

      - name: Publish to npm with trusted publishing
        run: npm publish --access public
